author: EnderDevelopment
description: A plugin where you play as gods with god powers and weapons.
api-version: "1.21"
commands:
  godmode:
    description: Toggle god mode.
    usage: /godmode
  summonweapon:
    description: Summon a god weapon.
    usage: /summonweapon